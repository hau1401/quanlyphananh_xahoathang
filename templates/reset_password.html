{% extends "base.html" %}

{% block title %}Đặt lại mật khẩu - UBND Xã Hòa Thắng{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
        <div class="card shadow-sm border-0 rounded-3">
            <div class="card-header bg-success text-white text-center py-3">
                <h4 class="mb-0 fw-bold">🔑 Đặt Lại Mật Khẩu</h4>
            </div>
            <div class="card-body p-4">
                <form action="{{ url_for('reset_password') }}" method="POST" autocomplete="off">
                    <div class="mb-3">
                        <label class="form-label fw-bold">Mật khẩu mới <span class="text-danger">*</span></label>
                        <input type="password" name="new_password" class="form-control" placeholder="Nhập mật khẩu mới" autocomplete="new-password" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-bold">Xác nhận mật khẩu mới <span class="text-danger">*</span></label>
                        <input type="password" name="confirm_password" class="form-control" placeholder="Nhập lại mật khẩu mới" autocomplete="new-password" required>
                    </div>

                    <div class="d-grid gap-2 mt-4">
                        <button type="submit" class="btn btn-success fw-bold">
                            <i class="fa-solid fa-check me-1"></i> Lưu mật khẩu mới
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
