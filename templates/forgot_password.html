{% extends "base.html" %}

{% block title %}Quên mật khẩu - UBND Xã Hòa Thắng{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
        <div class="card shadow-sm border-0 rounded-3">
            <div class="card-header bg-primary text-white text-center py-3">
                <h4 class="mb-0 fw-bold">🔍 Quên Mật Khẩu</h4>
            </div>
            <div class="card-body p-4">
                <p class="text-muted small mb-4">
                    Vui lòng nhập <strong>Tên đăng nhập</strong> và <strong>Email</strong> đăng ký để xác minh tài khoản của bạn.
                </p>

                <form action="{{ url_for('forgot_password') }}" method="POST" autocomplete="off">
                    <div class="mb-3">
                        <label class="form-label fw-bold">Tên đăng nhập <span class="text-danger">*</span></label>
                        <input type="text" name="username" class="form-control" placeholder="Nhập tên đăng nhập" autocomplete="off" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-bold">Email đăng ký <span class="text-danger">*</span></label>
                        <input type="email" name="email" class="form-control" placeholder="example@email.com" autocomplete="off" required>
                    </div>

                    <div class="d-grid gap-2 mt-4">
                        <button type="submit" class="btn btn-primary fw-bold">
                            <i class="fa-solid fa-key me-1"></i> Xác minh tài khoản
                        </button>
                        <a href="{{ url_for('login') }}" class="btn btn-outline-secondary text-center">
                            <i class="fa-solid fa-arrow-left me-1"></i> Quay lại Đăng nhập
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
