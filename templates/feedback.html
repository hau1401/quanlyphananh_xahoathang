{% extends "base.html" %}

{% block title %}Gửi Phản Ánh Kiến Nghị - UBND Xã Hòa Thắng{% endblock %}

{% block content %}
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card shadow-sm border-0">
            <div class="card-header bg-primary text-white p-3">
                <h4 class="mb-0 fw-bold"><i class="fa-solid fa-pen-to-square me-2"></i>Gửi Phản Ánh / Kiến Nghị</h4>
            </div>
            <div class="card-body p-4">
                <form action="{{ url_for('feedback') }}" method="POST" enctype="multipart/form-data">
                    
                    <h6 class="fw-bold text-primary mb-3">1. Thông tin người gửi</h6>
                    <div class="row g-3 mb-3">
                        <div class="col-md-6">
                            <label class="form-label fw-bold">Họ và tên <span class="text-danger">*</span></label>
                            <input type="text" name="fullname" class="form-control" value="{{ session.get('fullname', '') }}" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-bold">Số điện thoại <span class="text-danger">*</span></label>
                            <input type="tel" name="phone" class="form-control" placeholder="Ví dụ: 0912345678" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Email (không bắt buộc)</label>
                            <input type="email" name="email" class="form-control">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Địa chỉ xảy ra sự việc</label>
                            <input type="text" id="address" name="address" class="form-control" placeholder="Thôn/Buôn/Xóm...">
                        </div>
                    </div>

                    <h6 class="fw-bold text-primary mb-3">2. Vị trí trên bản đồ (Định vị GPS)</h6>
                    <div class="mb-3">
                        <button type="button" class="btn btn-sm btn-outline-primary mb-2" onclick="getLocation()">
                            <i class="fa-solid fa-location-crosshairs me-1"></i> Tự động lấy vị trí hiện tại
                        </button>
                        <div id="map" class="rounded border shadow-sm" style="height: 200px;"></div>
                        <input type="hidden" id="latitude" name="latitude">
                        <input type="hidden" id="longitude" name="longitude">
                    </div>

                    <h6 class="fw-bold text-primary mb-3">3. Nội dung phản ánh</h6>
                    <div class="mb-3">
                        <label class="form-label fw-bold">Lĩnh vực phản ánh <span class="text-danger">*</span></label>
                        <select name="category" class="form-select" required>
                            <option value="">-- Chọn lĩnh vực --</option>
                            {% for cat in categories %}
                                <option value="{{ cat.id }}">{{ cat.name }}</option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-bold">Tiêu đề phản ánh <span class="text-danger">*</span></label>
                        <input type="text" name="title" class="form-control" placeholder="Tóm tắt ngắn gọn nội dung sự việc" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-bold">Nội dung chi tiết <span class="text-danger">*</span></label>
                        <textarea name="content" class="form-control" rows="5" placeholder="Mô tả cụ thể thời gian, địa điểm, sự việc..." required></textarea>
                    </div>

                    <div class="mb-4">
                        <label class="form-label fw-bold">Tệp đính kèm (Ảnh / Video minh chứng)</label>
                        <input type="file" name="media_files" class="form-control" multiple accept="image/*,video/*">
                        <small class="text-muted d-block mt-1">Được gửi tối đa 5 tệp (Hình ảnh hoặc Video ngắn).</small>
                    </div>

                    <button type="submit" class="btn btn-primary btn-lg w-100 fw-bold shadow-sm">
                        <i class="fa-solid fa-paper-plane me-2"></i>Gửi phản ánh
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>

<script>
var map = L.map('map').setView([12.6667, 108.0500], 13); // Mặc định xã Hòa Thắng
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '© OpenStreetMap' }).addTo(map);

var marker;

function onMapClick(e) {
    if (marker) map.removeLayer(marker);
    marker = L.marker(e.latlng).addTo(map);
    document.getElementById('latitude').value = e.latlng.lat;
    document.getElementById('longitude').value = e.latlng.lng;
}

map.on('click', onMapClick);

function getLocation() {
    if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(function(position) {
            var lat = position.coords.latitude;
            var lng = position.coords.longitude;
            map.setView([lat, lng], 16);
            if (marker) map.removeLayer(marker);
            marker = L.marker([lat, lng]).addTo(map).bindPopup("Vị trí của bạn").openPopup();
            document.getElementById('latitude').value = lat;
            document.getElementById('longitude').value = lng;
        });
    } else {
        alert("Trình duyệt không hỗ trợ định vị vị trí!");
    }
}
</script>
{% endblock %}
