{% extends "base.html" %}

{% block title %}Đăng ký tài khoản - UBND Xã Hòa Thắng{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
        <div class="card shadow-sm border-0 rounded-3">
            <div class="card-header bg-success text-white text-center py-3">
                <h4 class="mb-0 fw-bold">📝 Đăng Ký Tài Khoản</h4>
            </div>
            <div class="card-body p-4">
                <form action="{{ url_for('register') }}" method="POST" autocomplete="off">
                    <div class="mb-3">
                        <label class="form-label fw-bold">Họ và tên <span class="text-danger">*</span></label>
                        <input type="text" name="fullname" class="form-control" placeholder="Nhập họ và tên" pattern="[A-Za-zÀ-ỹ ]+" title="Chỉ nhập chữ" autocomplete="off" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-bold">Tên đăng nhập <span class="text-danger">*</span></label>
                        <input type="text" name="username" class="form-control" placeholder="Tạo tên đăng nhập" autocomplete="off" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-bold">Địa chỉ Email <span class="text-danger">*</span></label>
                        <input type="email" name="email" class="form-control" placeholder="example@email.com" autocomplete="off" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-bold">Số điện thoại <span class="text-danger">*</span></label>
                        <input type="tel" name="phone" class="form-control" placeholder="09xxxxxxxx" pattern="[0-9]{10,11}" title="Chỉ nhập số từ 10 đến 11 chữ số" autocomplete="off" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-bold">Mật khẩu <span class="text-danger">*</span></label>
                        <input type="password" name="password" class="form-control" placeholder="Nhập mật khẩu" autocomplete="new-password" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-bold">Nhập lại mật khẩu <span class="text-danger">*</span></label>
                        <input type="password" name="confirm" class="form-control" placeholder="Nhập lại mật khẩu" autocomplete="new-password" required>
                    </div>

                    <div class="d-grid gap-2 mt-4">
                        <button type="submit" class="btn btn-success fw-bold">Đăng ký</button>
                        <a href="{{ url_for('login') }}" class="btn btn-outline-secondary text-center">Đã có tài khoản? Đăng nhập</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
