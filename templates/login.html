{% extends "base.html" %}

{% block title %}Đăng nhập - UBND Xã Hòa Thắng{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
        <div class="card shadow-sm border-0 rounded-3">
            <div class="card-header bg-primary text-white text-center py-3">
                <h4 class="mb-0 fw-bold">🔑 Đăng Nhập Hệ Thống</h4>
            </div>
            <div class="card-body p-4">
                <form action="{{ url_for('login') }}" method="POST" autocomplete="off">
                    <div class="mb-3">
                        <label class="form-label fw-bold">Tên đăng nhập <span class="text-danger">*</span></label>
                        <input type="text" name="username" class="form-control" placeholder="Nhập tên đăng nhập" autocomplete="off" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-bold">Mật khẩu <span class="text-danger">*</span></label>
                        <input type="password" name="password" class="form-control" placeholder="Nhập mật khẩu" autocomplete="current-password" required>
                    </div>

                    <div class="mb-3 text-end">
                        <a href="{{ url_for('forgot_password') }}" class="text-decoration-none small">Quên mật khẩu?</a>
                    </div>

                    <div class="d-grid gap-2 mt-4">
                        <button type="submit" class="btn btn-primary fw-bold">Đăng nhập</button>
                        <a href="{{ url_for('register') }}" class="btn btn-outline-secondary text-center">Chưa có tài khoản? Đăng ký</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
