{% extends "base.html" %}

{% block title %}Thông tin cá nhân - UBND Xã Hòa Thắng{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-8">
        <div class="card shadow-sm border-0 rounded-3">
            <div class="card-header bg-primary text-white p-3">
                <h4 class="mb-0 fw-bold">⚙️ Quản Lý Tài Khoản</h4>
            </div>
            <div class="card-body p-4">
                
                <!-- Thanh Chuyển Tab (Bootstrap 5 Nav Tabs) -->
                <ul class="nav nav-tabs nav-justified mb-4" id="profileTab" role="tablist">
                    <li class="nav-item" role="presentation">
                        <button class="nav-link active fw-bold" id="info-tab" data-bs-toggle="tab" data-bs-target="#info-pane" type="button" role="tab" aria-controls="info-pane" aria-selected="true">
                            👤 Thông tin cá nhân
                        </button>
                    </li>
                    <li class="nav-item" role="presentation">
                        <button class="nav-link fw-bold" id="password-tab" data-bs-toggle="tab" data-bs-target="#password-pane" type="button" role="tab" aria-controls="password-pane" aria-selected="false">
                            🔒 Đổi mật khẩu
                        </button>
                    </li>
                </ul>

                <!-- Nội Dung Các Tab -->
                <div class="tab-content" id="profileTabContent">
                    
                    <!-- TAB 1: THÔNG TIN CÁ NHÂN -->
                    <div class="tab-pane fade show active" id="info-pane" role="tabpanel" aria-labelledby="info-tab" tabindex="0">
                        <form action="{{ url_for('update_profile') }}" method="POST" autocomplete="off">
                            <div class="mb-3">
                                <label class="form-label fw-bold">Họ và tên <span class="text-danger">*</span></label>
                                <input type="text" name="fullname" class="form-control" value="{{ user.fullname if user else session.get('fullname', '') }}" autocomplete="off" required>
                            </div>
                            
                            <div class="mb-3">
                                <label class="form-label fw-bold">Số điện thoại</label>
                                <input type="tel" name="phone" class="form-control" value="{{ user.phone if user and user.phone else '' }}" placeholder="09xxxxxxxx" autocomplete="off">
                            </div>

                            <div class="mb-3">
                                <label class="form-label fw-bold">Địa chỉ Email</label>
                                <input type="email" name="email" class="form-control" value="{{ user.email if user and user.email else '' }}" placeholder="example@email.com" autocomplete="off">
                            </div>

                            <div class="mb-3">
                                <label class="form-label fw-bold">Vai trò tài khoản</label>
                                <input type="text" class="form-control bg-light" value="{{ 'Quản trị viên (Admin)' if session.get('role') == 'admin' else 'Nhân viên / Người dùng' }}" readonly>
                            </div>

                            <div class="mt-4 text-end">
                                <button type="submit" class="btn btn-primary px-4 fw-bold">
                                    💾 Cập nhật thông tin
                                </button>
                            </div>
                        </form>
                    </div>

                    <!-- TAB 2: ĐỔI MẬT KHẨU -->
                    <div class="tab-pane fade" id="password-pane" role="tabpanel" aria-labelledby="password-tab" tabindex="0">
                        <form action="{{ url_for('change_password') }}" method="POST" autocomplete="off">
                            <div class="mb-3">
                                <label class="form-label fw-bold">Mật khẩu hiện tại <span class="text-danger">*</span></label>
                                <input type="password" name="current_password" class="form-control" placeholder="Nhập mật khẩu cũ" autocomplete="current-password" required>
                            </div>

                            <div class="mb-3">
                                <label class="form-label fw-bold">Mật khẩu mới <span class="text-danger">*</span></label>
                                <input type="password" name="new_password" class="form-control" placeholder="Nhập mật khẩu mới" autocomplete="new-password" required>
                            </div>

                            <div class="mb-3">
                                <label class="form-label fw-bold">Xác nhận mật khẩu mới <span class="text-danger">*</span></label>
                                <input type="password" name="confirm_password" class="form-control" placeholder="Nhập lại mật khẩu mới" autocomplete="new-password" required>
                            </div>

                            <div class="mt-4 text-end">
                                <button type="submit" class="btn btn-warning text-dark px-4 fw-bold">
                                    🔑 Đổi mật khẩu
                                </button>
                            </div>
                        </form>
                    </div>

                </div>

            </div>
        </div>
    </div>
</div>
{% endblock %}
